name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Installs exactly what package-lock.json lists.
      - run: npm ci

      # No secrets: vite.config.ts gives the tests their own VITE_API_URL.
      - run: npm test

      # tsc -b, then vite build: type errors anywhere in src/ fail here,
      # test files included.
      - run: npm run build